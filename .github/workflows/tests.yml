name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . pytest

      - name: Unit tests (mocked, no credentials)
        run: .venv/bin/python -m pytest tests/ -q

      - name: Import check
        run: .venv/bin/python -c "from mcp_copernicus import server; print('ok')"
