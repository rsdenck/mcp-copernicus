[project]
name = "mcp-copernicus"
version = "0.1.0"
description = "MCP server for the Copernicus Data Space Ecosystem: catalogue (OData), object storage (S3) and openEO processing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranlens Denck" }]
keywords = ["mcp", "copernicus", "sentinel", "openeo", "odata", "earth-observation"]
dependencies = [
    "mcp>=2.0",
    "openeo>=0.50",
    "requests>=2.31",
    "boto3>=1.34",
]

[project.scripts]
mcp-copernicus = "mcp_copernicus.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_copernicus"]
